{% extends "base.html" %}
{% block title %}Create Job{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Create Job Posting</h1>

    <form method="POST" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Basic Information</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Job Title *</label>
                    <input type="text" name="title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none" placeholder="e.g., Senior Python Developer">
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Company *</label>
                        <input type="text" name="company" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                        <input type="text" name="location" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none" placeholder="e.g., Lagos, Nigeria">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Employment Type</label>
                    <select name="employment_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                        <option value="full-time">Full-time</option>
                        <option value="part-time">Part-time</option>
                        <option value="contract">Contract</option>
                        <option value="internship">Internship</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Job Description *</h2>
            <textarea name="description" id="job-description" required rows="8" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none" placeholder="Describe the role, responsibilities, and requirements..."></textarea>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-900">Skills & Requirements</h2>
                <button type="button" id="suggest-skills-btn" onclick="suggestSkills()" class="bg-purple-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-purple-700 transition flex items-center space-x-1">
                    <span>AI Suggest</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </button>
            </div>
            <div id="suggest-status" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Required Skills</label>
                    <input type="text" name="required_skills" id="required-skills" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none" placeholder="e.g., Python, Flask, SQL, Git">
                    <p class="text-xs text-gray-500 mt-1">Separate with commas</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Preferred Skills</label>
                    <input type="text" name="preferred_skills" id="preferred-skills" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none" placeholder="e.g., Docker, AWS, Redis">
                    <p class="text-xs text-gray-500 mt-1">Separate with commas</p>
                </div>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Minimum Experience (years)</label>
                        <input type="number" name="minimum_experience" min="0" max="30" value="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Education Requirement</label>
                        <select name="education_requirement" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                            <option value="">Any</option>
                            <option value="certificate">Certificate</option>
                            <option value="diploma">Diploma / ND</option>
                            <option value="HND">HND</option>
                            <option value="bachelor">Bachelor's Degree</option>
                            <option value="master">Master's Degree</option>
                            <option value="phd">PhD</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex space-x-3">
            <button type="submit" class="bg-primary-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-primary-700 transition">
                Create Job Posting
            </button>
            <a href="{{ url_for('recruiter.recruiter_jobs') }}" class="border border-gray-300 text-gray-700 px-6 py-2.5 rounded-lg font-medium hover:bg-gray-50 transition">
                Cancel
            </a>
        </div>
    </form>
</div>

<script>
async function suggestSkills() {
    const description = document.getElementById('job-description').value;
    const btn = document.getElementById('suggest-skills-btn');
    const status = document.getElementById('suggest-status');

    if (!description.trim()) {
        status.className = 'mb-4 p-3 rounded-lg text-sm bg-yellow-50 border border-yellow-200 text-yellow-700';
        status.textContent = 'Please enter a job description first.';
        status.classList.remove('hidden');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span><span>Analyzing...</span>';
    status.className = 'mb-4 p-3 rounded-lg text-sm bg-blue-50 border border-blue-200 text-blue-700';
    status.textContent = 'AI is analyzing your job description...';
    status.classList.remove('hidden');

    try {
        const resp = await fetch('/api/suggest-skills', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
            },
            body: JSON.stringify({ description: description })
        });
        const data = await resp.json();

        if (resp.ok) {
            if (data.required_skills && data.required_skills.length > 0) {
                document.getElementById('required-skills').value = data.required_skills.join(', ');
            }
            if (data.preferred_skills && data.preferred_skills.length > 0) {
                document.getElementById('preferred-skills').value = data.preferred_skills.join(', ');
            }
            status.className = 'mb-4 p-3 rounded-lg text-sm bg-green-50 border border-green-200 text-green-700';
            status.textContent = 'Skills suggested by AI! Review and adjust as needed.';
        } else {
            status.className = 'mb-4 p-3 rounded-lg text-sm bg-red-50 border border-red-200 text-red-700';
            status.textContent = data.error || 'Failed to get suggestions.';
        }
    } catch (err) {
        status.className = 'mb-4 p-3 rounded-lg text-sm bg-red-50 border border-red-200 text-red-700';
        status.textContent = 'Network error. Please try again.';
    }

    btn.disabled = false;
    btn.innerHTML = '<span>AI Suggest</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>';
}
</script>
{% endblock %}
