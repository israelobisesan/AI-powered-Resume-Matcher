{% extends "base.html" %}
{% block title %}Register - AI Resume Matcher{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Create Account</h2>
            <p class="text-gray-600 mt-2">Join as a Job Seeker or Recruiter</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition">
                </div>

                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition">
                </div>

                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required minlength="6"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition">
                    <p class="text-xs text-gray-500 mt-1">At least 6 characters</p>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">I am a...</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="role" value="job_seeker" class="peer sr-only" required>
                            <div class="border-2 border-gray-200 rounded-lg p-4 text-center peer-checked:border-primary-500 peer-checked:bg-primary-50 transition">
                                <div class="text-2xl mb-1">👤</div>
                                <div class="font-medium text-gray-900">Job Seeker</div>
                                <div class="text-xs text-gray-500">Find my next role</div>
                            </div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="role" value="recruiter" class="peer sr-only">
                            <div class="border-2 border-gray-200 rounded-lg p-4 text-center peer-checked:border-primary-500 peer-checked:bg-primary-50 transition">
                                <div class="text-2xl mb-1">🏢</div>
                                <div class="font-medium text-gray-900">Recruiter</div>
                                <div class="text-xs text-gray-500">Hire talent</div>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-lg font-semibold hover:bg-primary-700 transition">
                    Create Account
                </button>
            </form>

            <p class="text-center mt-6 text-sm text-gray-600">
                Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary-600 hover:underline font-medium">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
