{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Profile</h1>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4">Account Information</h2>
        <form method="POST" action="{{ url_for('seeker.edit_profile') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="text-sm text-gray-500 block mb-1">Name</label>
                    <input type="text" name="name" value="{{ current_user.name }}" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                           maxlength="100" required>
                </div>
                <div>
                    <label class="text-sm text-gray-500 block mb-1">Email</label>
                    <input type="email" value="{{ current_user.email }}" disabled
                           class="w-full px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-500 cursor-not-allowed">
                    <p class="text-xs text-gray-400 mt-1">Email cannot be changed</p>
                </div>
            </div>

            <div class="flex space-x-3">
                <button type="submit" class="bg-primary-600 text-white px-6 py-2 rounded-lg hover:bg-primary-700 transition font-medium">
                    Save Changes
                </button>
                <a href="{{ url_for('seeker.profile') }}" class="bg-gray-100 text-gray-600 px-6 py-2 rounded-lg hover:bg-gray-200 transition font-medium">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
