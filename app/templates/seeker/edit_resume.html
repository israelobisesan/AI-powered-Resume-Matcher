{% extends "base.html" %}
{% block title %}Edit Resume{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Resume</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- Personal Information -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Personal Information</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" name="candidate_name" value="{{ resume.candidate_name or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" value="{{ resume.email or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                    <input type="text" name="phone" value="{{ resume.phone or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
                </div>
            </div>
        </div>

        <!-- Skills -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Skills</h2>
            <p class="text-sm text-gray-500 mb-2">Separate skills with commas</p>
            <input type="text" name="skills" value="{{ skills|join(', ') }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none">
        </div>

        <!-- Education -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Education</h2>
            <div id="education-entries">
                {% for edu in education %}
                <div class="education-entry border border-gray-200 rounded-lg p-4 mb-3">
                    <input type="text" placeholder="Degree" value="{{ edu.degree or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="degree">
                    <input type="text" placeholder="Field of Study" value="{{ edu.field or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="field">
                    <input type="text" placeholder="Institution" value="{{ edu.institution or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="institution">
                    <input type="text" placeholder="Year" value="{{ edu.year or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" data-field="year">
                </div>
                {% endfor %}
            </div>
            <button type="button" onclick="addEducation()" class="text-primary-600 hover:text-primary-700 text-sm font-medium mt-2">+ Add Education</button>
            <input type="hidden" name="education" id="education-data">
        </div>

        <!-- Work Experience -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Work Experience</h2>
            <div id="experience-entries">
                {% for exp in experience %}
                <div class="experience-entry border border-gray-200 rounded-lg p-4 mb-3">
                    <input type="text" placeholder="Job Title" value="{{ exp.title or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="title">
                    <input type="text" placeholder="Company" value="{{ exp.company or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="company">
                    <input type="text" placeholder="Dates (e.g., Jan 2020 - Present)" value="{{ exp.dates or '' }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="dates">
                    <textarea placeholder="Description" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" rows="2" data-field="description">{{ exp.description or '' }}</textarea>
                </div>
                {% endfor %}
            </div>
            <button type="button" onclick="addExperience()" class="text-primary-600 hover:text-primary-700 text-sm font-medium mt-2">+ Add Experience</button>
            <input type="hidden" name="experience" id="experience-data">
        </div>

        <div class="flex space-x-3">
            <button type="submit" onclick="prepareData()" class="bg-primary-600 text-white px-6 py-2 rounded-lg hover:bg-primary-700 transition font-medium">
                Save Changes
            </button>
            <a href="{{ url_for('resume.view_resume') }}" class="border border-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-50 transition font-medium">
                Cancel
            </a>
        </div>
    </form>
</div>

<script>
function addEducation() {
    const container = document.getElementById('education-entries');
    const entry = document.createElement('div');
    entry.className = 'education-entry border border-gray-200 rounded-lg p-4 mb-3';
    entry.innerHTML = `
        <input type="text" placeholder="Degree" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="degree">
        <input type="text" placeholder="Field of Study" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="field">
        <input type="text" placeholder="Institution" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="institution">
        <input type="text" placeholder="Year" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" data-field="year">
    `;
    container.appendChild(entry);
}

function addExperience() {
    const container = document.getElementById('experience-entries');
    const entry = document.createElement('div');
    entry.className = 'experience-entry border border-gray-200 rounded-lg p-4 mb-3';
    entry.innerHTML = `
        <input type="text" placeholder="Job Title" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="title">
        <input type="text" placeholder="Company" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="company">
        <input type="text" placeholder="Dates" class="w-full px-3 py-2 border border-gray-300 rounded-lg mb-2 text-sm" data-field="dates">
        <textarea placeholder="Description" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" rows="2" data-field="description"></textarea>
    `;
    container.appendChild(entry);
}

function collectEntries(containerId, className) {
    const entries = [];
    document.querySelectorAll('.' + className).forEach(el => {
        const entry = {};
        el.querySelectorAll('[data-field]').forEach(field => {
            entry[field.dataset.field] = field.value;
        });
        entries.push(entry);
    });
    return entries;
}

function prepareData() {
    document.getElementById('education-data').value = JSON.stringify(collectEntries('education-entries', 'education-entry'));
    document.getElementById('experience-data').value = JSON.stringify(collectEntries('experience-entries', 'experience-entry'));
}
</script>
{% endblock %}
